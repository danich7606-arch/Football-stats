name: Update Football Stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check API key
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "API key is missing"
            exit 1
          fi
          echo "API key is configured"

      - name: Download Manchester United matches
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          curl --fail --silent --show-error \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?team=33&season=2024" \
            -o matches.json
