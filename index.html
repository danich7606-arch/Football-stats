
<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Stats</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101b2a;
      color: #fff;
    }
    header {
      background: #172a40;
      padding: 25px 16px;
      text-align: center;
      border-bottom: 3px solid #25b66c;
    }
    h1 { margin: 0; color: #42df90; }
    header p { color: #b8c7d8; }
    main { max-width: 950px; margin: auto; padding: 20px; }
    .panel {
      background: #1c3047;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 18px;
    }
    select {
      padding: 12px;
      background: #102033;
      color: white;
      border: 1px solid #52718c;
      border-radius: 8px;
      font-size: 16px;
      margin: 8px 8px 8px 0;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 12px;
    }
    .card {
      background: #233c56;
      border-radius: 10px;
      padding: 18px;
      text-align: center;
    }
    .number { font-size: 30px; font-weight: bold; color: #42df90; }
    .label { color: #b8c7d8; margin-top: 7px; }
    .match {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #38516a;
    }
    .match:last-child { border-bottom: none; }
    .result { font-weight: bold; white-space: nowrap; }
    .note { color: #b8c7d8; font-size: 14px; }
    .error { color: #ffb3b3; }
  </style>
</head>
<body>
  <header>
    <h1>⚽ Football Stats</h1>
    <p>Реални футболни резултати и статистика</p>
  </header>

  <main>
    <section class="panel">
      <h2>Избери отбор и брой мачове</h2>
      <select id="team">
        <option value="33">Манчестър Юнайтед</option>
      </select>
      <select id="count">
        <option value="5">Последни 5 мача</option>
        <option value="10">Последни 10 мача</option>
      </select>
      <p class="note">
        Данни от сезон 2024. Засега е наличен Манчестър Юнайтед.
      </p>
    </section>

    <section class="panel">
      <h2 id="heading">Статистика</h2>
      <p id="status">Зареждане...</p>
      <div class="cards" id="cards"></div>
    </section>

    <section class="panel">
      <h2>Резултати от мачовете</h2>
      <div id="matches"></div>
    </section>
  </main>

  <script>
    const TEAM_ID = 33;
    let allMatches = [];

    function card(label, value) {
      return `<div class="card">
        <div class="number">${value}</div>
        <div class="label">${label}</div>
      </div>`;
    }

    function showStats() {
      const count = Number(document.getElementById("count").value);

      const finished = allMatches
        .filter(m =>
          m.teams?.home?.id === TEAM_ID ||
          m.teams?.away?.id === TEAM_ID
        )
        .filter(m =>
          ["FT", "AET", "PEN"].includes(m.fixture?.status?.short)
        )
        .filter(m =>
          Number.isFinite(m.goals?.home) &&
          Number.isFinite(m.goals?.away)
        )
        .sort((a, b) =>
          new Date(b.fixture.date) - new Date(a.fixture.date)
        )
        .slice(0, count);

      let wins = 0, draws = 0, losses = 0;
      let scored = 0, conceded = 0;

      const rows = finished.map(m => {
        const home = m.teams.home.id === TEAM_ID;
        const own = home ? m.goals.home : m.goals.away;
        const other = home ? m.goals.away : m.goals.home;

        scored += own;
        conceded += other;

        if (own > other) wins++;
        else if (own === other) draws++;
        else losses++;

        const date = new Date(m.fixture.date)
          .toLocaleDateString("bg-BG");

        const homeName = m.teams.home.name;
        const awayName = m.teams.away.name;

        return `<div class="match">
          <span>${date}: ${homeName} – ${awayName}</span>
          <span class="result">${m.goals.home} : ${m.goals.away}</span>
        </div>`;
      });

      document.getElementById("heading").textContent =
        `Манчестър Юнайтед – последни ${finished.length} мача`;

      document.getElementById("status").textContent =
        finished.length
          ? "Реални резултати от API-Football"
          : "Няма намерени завършили мачове.";

      document.getElementById("cards").innerHTML =
        card("Победи", wins) +
        card("Равенства", draws) +
        card("Загуби", losses) +
        card("Вкарани голове", scored) +
        card("Допуснати голове", conceded) +
        card("Средно вкарани голове",
          finished.length ? (scored / finished.length).toFixed(2) : "0");

      document.getElementById("matches").innerHTML =
        rows.join("") || "<p>Няма данни за мачове.</p>";
    }

    fetch("matches.json")
      .then(response => {
        if (!response.ok) throw new Error("Файлът не е достъпен");
        return response.json();
      })
      .then(data => {
        if (!Array.isArray(data.response)) {
          throw new Error("Невалидни данни от API");
        }
        allMatches = data.response;
        showStats();
      })
      .catch(error => {
        document.getElementById("status").textContent =
          "Грешка при зареждането: " + error.message;
        document.getElementById("status").className = "error";
      });

    document.getElementById("count")
      .addEventListener("change", showStats);
  </script>
</body>
</html>
